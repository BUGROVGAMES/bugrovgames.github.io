name: BUGROVGAMES AI Journalist

on:
  schedule:
    - cron: '0 7,10,13,16,19,22 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-news:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run AI Journalist
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node bot.mjs

      - name: Commit new draft
        run: |
          git config user.name "BUGROVGAMES Bot"
          git config user.email "bot@bugrovgames.com"
          git add articles.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "AI Bot: new draft article" && git push)
